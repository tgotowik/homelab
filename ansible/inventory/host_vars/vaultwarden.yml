    compose_files:
      - src: opt/vaultwarden/docker-compose.yml.j2
  - name: arcane-agent
    compose_files:
      - src: opt/arcane-agent/docker-compose.yml.j2

str_docker_compose_arcane_agent_token: "{{ cstr_docker_compose_arcane_agent_vaultwarden_token }}"