---
boolean_docker_watchtower_enabled: true
str_docker_watchtower_mode: "notify"
str_docker_watchtower_hostname: "jellyfin"

list_docker_compose_apps:
  - name: jellyfin
    compose_files:
      - src: opt/jellyfin/docker-compose.yml.j2
  - name: arcane-agent
    compose_files:
      - src: opt/arcane-agent/docker-compose.yml.j2

str_docker_compose_arcane_agent_token: "{{ cstr_docker_compose_arcane_agent_jellyfin_token }}"