---
- name: Include role variables
  ansible.builtin.include_tasks: "include_vars.yml"
  tags:
    - always
  loop:
    - "{{ ansible_os_family }}.yml" # e.g. Debian for ubuntu and debian
  loop_control:
    loop_var: vars_file

- name: Install onboarding packages
  ansible.builtin.package:
    name: "{{ list_controller_packages }}"
    state: latest
    update_cache: yes

- name: Configure scripts
  ansible.builtin.include_tasks:
    file: scripts/main.yml
    apply:
      tags:
        - scripts
  tags:
    - scripts
