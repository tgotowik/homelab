---
- name: Copy /home/ansible/.ssh/github_config
  ansible.builtin.template:
    src: home/ansible/.ssh/github_config.j2
    dest: /home/ansible/.ssh/github_config
    mode: "0600"
    owner: ansible
    group: ansible

- name: Add github ssh config
  ansible.builtin.lineinfile:
    path: "/home/ansible/.ssh/config"
    line: "Include github_config"
    insertbefore: BOF
    create: true
    owner: ansible
    group: ansible
    mode: '0600'
