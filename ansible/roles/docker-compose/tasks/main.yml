---
- name: Include role variables
  ansible.builtin.include_tasks: "include_vars.yml"
  tags:
    - always
  loop:
    - "{{ ansible_os_family }}.yml"
  loop_control:
    loop_var: vars_file

- name: Ensure app directories exist
  ansible.builtin.file:
    path: "{{ item.directory | default('/opt/' + item.name) }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ list_docker_compose_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy docker compose templates
  ansible.builtin.template:
    src: "{{ item.1.src }}"
    dest: "{{ item.0.directory | default('/opt/' + item.0.name) }}/{{ item.1.dest | default(item.1.src | basename | regex_replace('\\.j2$', '')) }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ list_docker_compose_apps | subelements('compose_files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} / {{ item.1.src }}"

- name: Copy static app files
  ansible.builtin.copy:
    src: "{{ item.1.src }}"
    dest: "{{ item.0.directory | default('/opt/' + item.0.name) }}/{{ item.1.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ list_docker_compose_apps | subelements('static_files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} / {{ item.1.src }}"

- name: Start docker compose apps
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ item.directory | default('/opt/' + item.name) }}"
  loop: "{{ list_docker_compose_apps }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: not ansible_check_mode