---
- name: Set authorized SSH keys
  ansible.builtin.template:
    src: root/.ssh/authorized_keys.j2
    dest: /root/.ssh/authorized_keys
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Set authorized SSH keys
  ansible.builtin.template:
    src: root/.ssh/config.j2
    dest: /root/.ssh/config
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'